AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Music Recommender - API de inferencia: Lambda con imagen de ECR, HTTP API de
  API Gateway, logs, dashboard y alarmas de CloudWatch.

Parameters:
  ProjectName:
    Type: String
    Default: music-recommender
  ImageUri:
    Type: String
    Description: Imagen en ECR, por ejemplo 123456789012.dkr.ecr.us-east-1.amazonaws.com/music-recommender:v1
  ArtifactsBucket:
    Type: String
    Description: Bucket creado por base.yaml (salida BucketName).
  ModelKey:
    Type: String
    Default: models/recommender.joblib
  LambdaRoleArn:
    Type: String
    Default: ""
    Description: >-
      Rol existente para la función (por ejemplo LabRole en AWS Academy). Vacío = se crea
      un rol con permisos mínimos.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Correo que recibe las alarmas. Vacío = sin suscripción.
  MemorySize:
    Type: Number
    Default: 2048
    Description: >-
      Lambda asigna CPU en proporción a la memoria; con 2048 MB el arranque en frío
      (importar pandas/scikit-learn y cargar el modelo) baja de los 10 s de la fase init.
  LatencyAlarmMs:
    Type: Number
    Default: 500
    Description: p95 de latencia del modelo que dispara la alarma.

Conditions:
  CreateRole: !Equals [!Ref LambdaRoleArn, ""]
  SubscribeEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: leer-modelo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactsBucket}/${ModelKey}"

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api"
      RetentionInDays: 14

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !If [CreateRole, !GetAtt FunctionRole.Arn, !Ref LambdaRoleArn]
      MemorySize: !Ref MemorySize
      Timeout: 30
      Environment:
        Variables:
          MODEL_S3_URI: !Sub "s3://${ArtifactsBucket}/${ModelKey}"

  # "Quick create": la HTTP API crea su ruta $default, la integración y la etapa.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP
      Target: !GetAtt Function.Arn

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alarmas"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: SubscribeEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-errores"
      AlarmDescription: La función Lambda falló al menos una vez en 5 minutos.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-latencia"
      AlarmDescription: El p95 de latencia de las recomendaciones pasó el umbral.
      Namespace: MusicRecommender
      MetricName: Latency
      Dimensions:
        - Name: Endpoint
          Value: recommendations
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref LatencyAlarmMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref ProjectName
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocaciones y errores",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${Function}"],
                  [".", "Errors", ".", "."],
                  [".", "Throttles", ".", "."]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Latencia del modelo (ms)",
                "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  ["MusicRecommender", "Latency", "Endpoint", "recommendations", { "stat": "p50", "label": "p50" }],
                  ["...", { "stat": "p95", "label": "p95" }]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Canciones no encontradas",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["MusicRecommender", "SongNotFound", "Endpoint", "recommendations"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Duración de Lambda (ms)",
                "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${Function}", { "stat": "p95", "label": "p95" }],
                  ["...", { "stat": "Maximum", "label": "máximo" }]
                ]
              }
            },
            {
              "type": "log", "x": 0, "y": 12, "width": 24, "height": 6,
              "properties": {
                "title": "Últimas predicciones",
                "region": "${AWS::Region}",
                "query": "SOURCE '/aws/lambda/${ProjectName}-api' | fields @timestamp, track_id, k, Recommendations, Latency, SongNotFound | filter Endpoint = 'recommendations' | sort @timestamp desc | limit 50",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionName:
    Value: !Ref Function
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ProjectName}"
