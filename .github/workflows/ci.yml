name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Pruebas
        run: pytest
  docker:
    # Revisa que la imagen de Lambda se construya; no la sube a ningún lado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        # Se salta mientras el Dockerfile no esté en el repositorio.
        if: hashFiles('Dockerfile') != ''
        run: docker build --platform linux/amd64 --provenance=false -t music-recommender:ci .
